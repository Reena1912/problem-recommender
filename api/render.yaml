services:
  - type: web
    name: leetcode-recommender-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LEETCODE_SESSION
        sync: false
      - key: LEETCODE_USERNAME
        sync: false

  - type: web
    name: leetcode-recommender-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE
        sync: false